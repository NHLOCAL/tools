name: Rebuild 16-type leg fix (one-off)

on:
  push:
    branches: [codex/redesign-16-type-illustrations]
    paths:
      - scripts/redraw_16_type_illustrations.py
      - tests/test_type_illustration_legs.py
      - .github/workflows/rebuild-16-type-leg-fix.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing build dependency
        run: python -m pip install -r requirements.txt
      - name: Rebuild the SVG set and standalone consumers
        run: |
          python scripts/redraw_16_type_illustrations.py
          node resources/the_16_types/build.cjs
          python build.py
      - name: Verify geometry, full test suite and deterministic build
        run: |
          python -m unittest discover -s tests -v
          node --test resources/the_16_types/scoring.test.cjs
          node resources/the_16_types/build.cjs --check
          git diff --name-only
      - name: Commit only generated illustration outputs
        shell: bash
        run: |
          allowed='^(assets/illustrations/16-types/[^/]+\.svg|tools/the_16_types\.html|assets/downloads/the_16_types\.js)$'
          changed="$(git diff --name-only)"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! printf '%s\n' "$file" | grep -Eq "$allowed"; then
              echo "Unexpected generated change: $file"
              exit 1
            fi
          done <<< "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/illustrations/16-types/*.svg tools/the_16_types.html assets/downloads/the_16_types.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix leg and shoe geometry across all 16 type illustrations'
          git push origin HEAD:refs/heads/codex/redesign-16-type-illustrations
